	<body>
		<script>
			class Dictionary {
				constructor(name) {
					this.name = name;
					this.words = {};
				}
				add(word, desc) {
					// console.log(word in this.words);
					if (!(word in this.words)) {
						this.words[word] = { word: word, description: desc };
					} else {
						console.log("key is exist");
						return undefined;
					}
				}
				remove(key) {
					if (key in this.words) {
						delete this.words[key];
					} else {
						console.log("key is not exist");
						return undefined;
					}
				}
				get(key) {
					if (key in this.words) {
						return this.words[key];
					} else {
						console.log("key is not exist");
						return undefined;
					}
				}
				showAllWords() {
					for (let w in this.words) {
						console.log(
							`${this.words[w]["word"]} - ${this.words[w]["description"]} `
						);
					}
				}
				print() {
					console.log(this.words);
				}
			}

			class HardWordsDictionary extends Dictionary {
				constructor(name) {
					super(name);
				}
				add(word, desc) {
					// console.log(word in this.words);
					if (!(word in this.words)) {
						this.words[word] = {
							word: word,
							description: desc,
							isDificult: true,
						};
					} else {
						console.log("key is exist");
						return undefined;
					}
				}
			}

			const hardWordsDictionary = new HardWordsDictionary("Сложные слова");

			hardWordsDictionary.add(
				"дилетант",
				"Тот, кто занимается наукой или искусством без специальной подготовки, обладая только поверхностными знаниями."
			);

			hardWordsDictionary.add(
				"неологизм",
				"Новое слово или выражение, а также новое значение старого слова."
			);

			hardWordsDictionary.add(
				"квант",
				"Неделимая часть какой-либо величины в физике."
			);

			hardWordsDictionary.remove("неологизм");

			hardWordsDictionary.showAllWords();
